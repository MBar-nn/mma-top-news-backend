app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
  security:
    jwt:
      secret: "b7f9c3e1a8d6e4c7b2a9f6d3e1c5b8a7f2c9d6e3b1a4d4f8c2a7e9b1f3c6a5d2"
      accessTokenExpirationSec: 60 #900   # 15 min
      refreshTokenExpirationSec: 43200 # 12 h

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
  error:
    include-stacktrace: never
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:@Test}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  security:
    require-ssl: false

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.cors: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized